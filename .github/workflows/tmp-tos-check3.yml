name: tmp-tos-check3

on:
  push:
    branches:
      - claude/gp-appointment-checker-pvhr5u
    paths:
      - '.github/workflows/tmp-tos-check3.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Fetch terms and conditions text, search for automation/scraping clauses
        run: |
          curl -sS "https://www.easyvisit.com.au/terms-and-conditions" -o page.html
          wc -c page.html
          python3 .github/scripts/check_tos.py
          wc -c page.txt
