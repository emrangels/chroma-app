name: tmp-tos-check2

on:
  push:
    branches:
      - claude/gp-appointment-checker-pvhr5u
    paths:
      - '.github/workflows/tmp-tos-check2.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Fetch terms and conditions text, search for automation/scraping clauses
        run: |
          curl -sS "https://www.easyvisit.com.au/terms-and-conditions" -o page.html
          echo "--- page size ---"
          wc -c page.html
          echo "--- stripped text, grep for relevant keywords with context ---"
          python3 -c "
import re
html = open('page.html', encoding='utf-8', errors='replace').read()
text = re.sub(r'<script.*?</script>', ' ', html, flags=re.S)
text = re.sub(r'<style.*?</style>', ' ', text, flags=re.S)
text = re.sub(r'<[^>]+>', ' ', text)
text = re.sub(r'\s+', ' ', text)
open('page.txt', 'w').write(text)
import sys
keywords = ['automat', 'robot', 'scrape', 'scraping', 'bot ', 'crawl', 'api ', 'unauthorized access', 'unauthoris']
lower = text.lower()
for kw in keywords:
    idx = 0
    found = False
    while True:
        i = lower.find(kw, idx)
        if i == -1:
            break
        found = True
        print(f'--- match for {kw!r} at {i} ---')
        print(text[max(0,i-200):i+200])
        print()
        idx = i + len(kw)
    if not found:
        print(f'no match for {kw!r}')
"
          echo "--- total text length ---"
          wc -c page.txt
