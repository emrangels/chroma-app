name: Check GP Appointments

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}
  push:
    branches:
      - claude/gp-appointment-checker-pvhr5u
    paths:
      - '.github/workflows/check-appointments.yml'
      - 'scripts/check_appointments.py'

permissions:
  contents: write

concurrency:
  group: check-appointments
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run appointment checker
        run: python3 scripts/check_appointments.py

      - name: Commit updated state
        run: |
          git add scripts/last_seen.json
          if ! git diff --cached --quiet -- scripts/last_seen.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: update appointment checker state"
            git push
          else
            echo "No state changes to commit."
          fi
