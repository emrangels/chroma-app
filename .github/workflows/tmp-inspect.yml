name: tmp-inspect-easyvisit

on:
  workflow_dispatch: {}
  push:
    branches:
      - claude/gp-appointment-checker-pvhr5u
    paths:
      - '.github/workflows/tmp-inspect.yml'
      - '.github/scripts/tmp_gha_inspect.js'

jobs:
  curl-test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Plain curl (no browser, no special headers) against discovered API
        run: |
          echo "--- Attempt 1: minimal headers, default curl UA ---"
          curl -sS -i "https://api.easyvisit.com.au/api/v1/Location/103/appointmenttypes/760/resources" | head -c 1500
          echo ""
          echo "--- Attempt 2: with Accept: application/json only ---"
          curl -sS -i -H "Accept: application/json" "https://api.easyvisit.com.au/api/v1/Location/103/appointmenttypes/760/resources" | head -c 1500
