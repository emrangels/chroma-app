name: tmp-inspect-easyvisit

on:
  workflow_dispatch: {}
  push:
    branches:
      - claude/gp-appointment-checker-pvhr5u
    paths:
      - '.github/workflows/tmp-inspect.yml'
      - '.github/scripts/tmp_gha_inspect.js'

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        timeout-minutes: 5
        run: |
          npm install playwright@1.48
          npx playwright install --with-deps chromium

      - name: Run inspection script
        timeout-minutes: 3
        run: node .github/scripts/tmp_gha_inspect.js

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inspect-output
          path: |
            screenshot.png
            api_calls.json
          if-no-files-found: ignore
